services:
  thesis-bot:
    build: .
    # No `init: true`: the bot must stay PID 1 and handle SIGTERM itself; an init
    # process would hold the bot token in a readable environ (docs/runbook.md).
    env_file: .env
    # The bot edits the glossary from Telegram; keep it on the host so a rebuild
    # does not drop it. Writes are in place (same inode), so a file mount works.
    volumes:
      - ./glossary.json:/app/glossary.json
    restart: unless-stopped
